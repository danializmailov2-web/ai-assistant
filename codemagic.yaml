workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 60
    environment:
      vars:
        PACKAGE_NAME: "ru.assistant.ai"
    scripts:
      - name: Build Android
        script: |
          sdkmanager "build-tools;33.0.0"
          cd app
          gradle assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk

workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 60
    environment:
      vars:
        PACKAGE_NAME: "ru.assistant.ai"
      android_sdk: 33
    scripts:
      - name: Build Android
        script: |
          # Устанавливаем правильный Gradle через SDK Manager
          sdkmanager "build-tools;33.0.0"
          # Собираем проект через встроенный gradle
          cd app
          gradle assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
